    </pattern>
    <linearGradient id="varredura" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffb454" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffb454" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="#0a1420"/>
  <rect width="1200" height="630" fill="url(#mar)"/>
  <rect width="1200" height="630" fill="url(#ambar-glow)"/>
  <rect width="1200" height="630" fill="url(#pontos)"/>

  <!-- radar -->
  <g transform="translate(930 318)">
    <circle r="196" fill="none" stroke="#82b4e1" stroke-opacity="0.18" stroke-width="2"/>
