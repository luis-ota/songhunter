    <circle r="86" fill="none" stroke="#82b4e1" stroke-opacity="0.12" stroke-width="1.5"/>
    <line x1="-196" y1="0" x2="196" y2="0" stroke="#82b4e1" stroke-opacity="0.10" stroke-width="1.5"/>
    <line x1="0" y1="-196" x2="0" y2="196" stroke="#82b4e1" stroke-opacity="0.10" stroke-width="1.5"/>
    <path d="M0 0 L0 -196 A196 196 0 0 1 138.6 -138.6 Z" fill="url(#varredura)"/>
    <path d="M0 0 L0 -196" stroke="#ffb454" stroke-width="3" stroke-linecap="round"/>
    <circle cx="-62" cy="-44" r="7" fill="#ffb454"/>
    <circle cx="84" cy="58" r="5" fill="#ffb454" opacity="0.75"/>
    <circle cx="36" cy="-120" r="4" fill="#ffb454" opacity="0.5"/>
    <circle r="10" fill="#ffb454"/>
  </g>

  <!-- grafismo -->
  <g transform="translate(88 92)">
    <circle cx="17" cy="17" r="16" fill="none" stroke="#6fd3ff" stroke-opacity="0.6" stroke-width="2"/>
    <circle cx="17" cy="17" r="9" fill="none" stroke="#6fd3ff" stroke-opacity="0.35" stroke-width="1.5"/>
