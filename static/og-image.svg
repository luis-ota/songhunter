    <text x="48" y="26" font-family="IBM Plex Mono" font-weight="600" font-size="21" letter-spacing="7" fill="#e9f2fa">SONGHUNTER</text>
  </g>

  <text x="88" y="292" font-family="Space Grotesk" font-weight="700" font-size="76" letter-spacing="-2" fill="#e9f2fa">cole o link.</text>
  <text x="88" y="374" font-family="Space Grotesk" font-weight="700" font-size="76" letter-spacing="-2" fill="#ffb454">a gente caça a música.</text>

