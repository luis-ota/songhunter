<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="mar" cx="50%" cy="-15%" r="90%">
      <stop offset="0%" stop-color="#6fd3ff" stop-opacity="0.16"/>
      <stop offset="55%" stop-color="#6fd3ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ambar-glow" cx="86%" cy="112%" r="70%">
      <stop offset="0%" stop-color="#ffb454" stop-opacity="0.14"/>
      <stop offset="60%" stop-color="#ffb454" stop-opacity="0"/>
    </radialGradient>
    <pattern id="pontos" width="28" height="28" patternUnits="userSpaceOnUse">
