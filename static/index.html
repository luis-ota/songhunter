  <script type="application/ld+json">
  {
    "@context": "https://schema.org",

  <style>
    *, *::before, *::after { box-sizing: border-box; }
    :root {
      --bg: #0a0a0b;
      --surface: #141416;
      --surface-raised: #1a1a1e;
      --border: #252528;
      --text: #f5f5f7;
      --text-secondary: #86868b;
      --accent: #e63946;
      --accent-dim: rgba(230, 57, 70, 0.15);
    }
    html { -webkit-font-smoothing: antialiased; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      line-height: 1.5;
    }
    .container {
      width: 100%;
      max-width: 640px;
      margin: 0 auto;
      padding: 0 1rem;
    }

    /* Header */
    header {
      padding: 2rem 0 1.5rem;
      border-bottom: 1px solid var(--border);
      margin-bottom: 2rem;
    }
    header h1 {
      font-size: 1.25rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      margin: 0 0 0.25rem;
      color: var(--text);
    }
    header p {
      font-size: 0.8125rem;
      color: var(--text-secondary);
      margin: 0;
    }

    /* Input area */
    .input-group {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 0.75rem;
    }
    .input-group input {
      flex: 1;
      padding: 0.625rem 0.875rem;
      font-size: 0.875rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      outline: none;
      font-family: inherit;
      transition: border-color 0.15s;
    }
    .input-group input::placeholder { color: var(--text-secondary); }
    .input-group input:focus { border-color: var(--accent); }
    .input-group button {
      padding: 0.625rem 1.25rem;
      font-size: 0.8125rem;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
      font-family: inherit;
      transition: opacity 0.15s;
      white-space: nowrap;
    }
    .input-group button:disabled { opacity: 0.4; cursor: not-allowed; }
    .input-group button:active { opacity: 0.8; }

    /* Progress */
    .progress-wrap {
      height: 2px;
      background: var(--border);
      border-radius: 1px;
      overflow: hidden;
      margin-bottom: 0.5rem;
      opacity: 0;
      transition: opacity 0.3s;
    }
    .progress-wrap.active { opacity: 1; }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: var(--accent);
      border-radius: 1px;
      transition: width 0.5s ease;
    }
    .status {
      font-size: 0.8125rem;
      color: var(--text-secondary);
      min-height: 1.25rem;
    }
    .status.error { color: var(--accent); }

    /* Ad slot */
    .ad-slot {
      width: 100%;
      min-height: 80px;
      border: 1px dashed var(--border);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-secondary);
      font-size: 0.75rem;
      margin: 1.5rem 0;
    }

    /* Hero result */
    .hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
      padding: 2rem 0 1.5rem;
      text-align: center;
    }
    .hero-artwork {
      width: 140px;
      height: 140px;
      border-radius: 6px;
      object-fit: cover;
      background: var(--surface);
      box-shadow: 0 12px 40px rgba(0,0,0,0.5);
    }
    .hero-title {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.3;
      margin: 0;
    }
    .hero-artist {
      font-size: 1rem;
      color: var(--text-secondary);
      margin: 0;
    }
    .hero-meta {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--accent);
    }
    .hero-links {
      display: flex;
      gap: 0.5rem;
      margin-top: 0.25rem;
    }
    .hero-links a {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--surface);
      border: 1px solid var(--border);
      transition: all 0.15s;
    }
    .hero-links a:active { background: var(--surface-raised); }
    .hero-links svg {
      width: 16px;
      height: 16px;
      fill: var(--text-secondary);
    }

    /* Lower results */
    .lower-section { margin-top: 1.5rem; }
    .lower-heading {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-secondary);
      margin: 0 0 0.75rem;
    }
    .lower-list { display: flex; flex-direction: column; gap: 0.5rem; }
    .lower-item {
      display: flex;
      gap: 0.75rem;
      align-items: center;
      padding: 0.625rem 0.75rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface);
    }
    .lower-item img {
      width: 40px;
      height: 40px;
      border-radius: 4px;
      object-fit: cover;
      background: var(--bg);
    }
    .lower-info { flex: 1; min-width: 0; }
    .lower-info .t {
      font-size: 0.875rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .lower-info .a {
      font-size: 0.75rem;
      color: var(--text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .lower-item .side {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 0.25rem;
      flex-shrink: 0;
    }
    .lower-item .pct {
      font-size: 0.6875rem;
      color: var(--accent);
    }
    .lower-item .stream-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--bg);
      border: 1px solid var(--border);
      transition: all 0.15s;
    }
    .lower-item .stream-icon:active { background: var(--surface-raised); }
    .lower-item .stream-icon svg {
      width: 13px;
      height: 13px;
      fill: var(--text-secondary);
    }

    .hidden { display: none !important; }

    /* Results card */
    .results-card {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 0 1.5rem 1.5rem;
      margin-top: 1.5rem;
    }

    /* Empty state */
    .empty-state {
      text-align: center;
      padding: 3rem 0;
      color: var(--text-secondary);
      font-size: 0.875rem;
    }

    footer {
      margin-top: auto;
      padding: 2rem 0;
      text-align: center;
      font-size: 0.75rem;
      color: var(--text-secondary);
    }

    @media (max-width: 480px) {
      .container { padding: 0 0.75rem; }
      header h1 { font-size: 1.125rem; }
      .input-group { flex-direction: column; }
      .input-group button { width: 100%; }
      .hero-artwork { width: 120px; height: 120px; }
      .hero-title { font-size: 1.25rem; }
      .results-card { padding: 0 1rem 1rem; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>SongHunter</h1>
      <p>Cole um link do TikTok, YouTube, Instagram, Twitter/X ou qualquer site com vídeo.</p>
    </header>

    <div class="input-group">
      <input type="url" id="urlInput" placeholder="https://www.tiktok.com/@user/video/123..." autocomplete="off" />
      <button id="searchBtn">Identificar</button>
    </div>
    <div class="progress-wrap" id="progressWrap">
      <div class="progress-fill" id="progressFill"></div>
    </div>
    <div class="status" id="status"></div>

    <div class="ad-slot" id="ad-top-banner" data-ad="top-banner"></div>
    <div class="ad-slot" id="ad-terra" data-ad="terra"></div>

    <div id="results" class="hidden">
      <div class="results-card" id="resultsCard">
        <div id="heroArea"></div>
        <div id="lowerArea" class="lower-section hidden">
          <p class="lower-heading">Outras possibilidades</p>
          <div id="lowerList" class="lower-list"></div>
        </div>
      </div>
    </div>

    <footer>SongHunter</footer>
  </div>

  <script>
    const urlInput = document.getElementById('urlInput');
    const searchBtn = document.getElementById('searchBtn');
    const statusEl = document.getElementById('status');
    const progressWrap = document.getElementById('progressWrap');
    const progressFill = document.getElementById('progressFill');
    const resultsEl = document.getElementById('results');
    const heroArea = document.getElementById('heroArea');
    const lowerArea = document.getElementById('lowerArea');
    const lowerList = document.getElementById('lowerList');

    function setStatus(msg, isError) {
      statusEl.textContent = msg;
      statusEl.className = 'status' + (isError ? ' error' : '');
    }

    function setProgress(pct) {
      progressWrap.classList.add('active');
      progressFill.style.width = Math.round(pct * 100) + '%';
    }

    function escapeHtml(s) {
      const d = document.createElement('div');
      d.textContent = s;
      return d.innerHTML;
    }

    function searchUrl(platform, title, artist) {
      const q = encodeURIComponent(title + ' ' + artist);
      switch (platform) {
        case 'youtube': return 'https://www.youtube.com/results?search_query=' + q;
        case 'spotify': return 'https://open.spotify.com/search/' + q;
        case 'applemusic': return 'https://music.apple.com/search?term=' + q;
        case 'deezer': return 'https://www.deezer.com/search/' + q;
      }
    }

    const icons = {
      youtube: '<svg viewBox="0 0 24 24"><path d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.5 12 3.5 12 3.5s-7.5 0-9.4.6A3 3 0 0 0 .5 6.2 36 36 0 0 0 0 12a36 36 0 0 0 .5 5.8 3 3 0 0 0 2.1 2.1c1.9.6 9.4.6 9.4.6s7.5 0 9.4-.6a3 3 0 0 0 2.1-2.1 36 36 0 0 0 .5-5.8 36 36 0 0 0-.5-5.8zM9.5 15.5V8.5l6.3 3.5z"/></svg>',
      spotify: '<svg viewBox="0 0 24 24"><path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.6 0 12 0zm5.5 17.3c-.2.3-.7.4-1 .2-2.8-1.7-6.3-2.1-10.5-1.2-.4.1-.8-.2-.9-.5-.1-.4.2-.8.5-.9 4.5-1 8.4-.6 11.6 1.4a.7.7 0 0 1 .3 1zM18.8 14a.9.9 0 0 1-1.2.3c-3.2-2-8-2.6-11.8-1.4a.9.9 0 0 1-1.1-.5.9.9 0 0 1 .5-1.1c4.3-1.3 9.5-.7 13.2 1.6.4.2.6.8.4 1.1zm.1-3.3c-3.8-2.3-10.2-2.5-13.8-1.4a1 1 0 0 1-1.3-.7 1 1 0 0 1 .7-1.2c4.2-1.3 11.2-1 15.5 1.6a1 1 0 0 1 .4 1.3 1 1 0 0 1-1.5.4z"/></svg>',
      applemusic: '<svg viewBox="0 0 24 24"><path d="M17.1 2H6.9C4.2 2 2 4.2 2 6.9v10.2C2 19.8 4.2 22 6.9 22h10.2c2.7 0 4.9-2.2 4.9-4.9V6.9C22 4.2 19.8 2 17.1 2zm-1.9 14.4c-.2.4-.6.6-1 .7-1.2.3-2.4-.4-2.7-1.6-.3-1.2.4-2.4 1.6-2.7.1 0 .2 0 .4-.1V8.8l-4.3 1v5.7c0 .1 0 .2-.1.3-.2.4-.6.6-1 .7-1.2.3-2.4-.4-2.7-1.6-.3-1.2.4-2.4 1.6-2.7.1 0 .2 0 .4-.1V7.6c0-.4.2-.7.6-.8l5.5-1.3c.4-.1.8.1.9.5.1.1.1.2.1.3v7.1c0 .1 0 .2-.1.3v.4z"/></svg>',
      deezer: '<svg viewBox="0 0 24 24"><path d="M2 3h2v2H2V3zm4 0h2v2H6V3zm4 0h2v2h-2V3zm4 0h2v2h-2V3zm4 0h2v2h-2V3zM2 7h2v2H2V7zm4 0h2v2H6V7zm4 0h2v2h-2V7zm4 0h2v2h-2V7zm4 0h2v2h-2V7zM2 11h2v2H2v-2zm4 0h2v2H6v-2zm4 0h2v2h-2v-2zm4 0h2v2h-2v-2zm4 0h2v2h-2v-2zM2 15h2v2H2v-2zm4 0h2v2H6v-2zm4 0h2v2h-2v-2zm4 0h2v2h-2v-2zm4 0h2v2h-2v-2zM2 19h2v2H2v-2zm4 0h2v2H6v-2zm4 0h2v2h-2v-2zm4 0h2v2h-2v-2zm4 0h2v2h-2v-2z"/></svg>'
    };

    async function pollResult(taskId) {
      var res = await fetch('/api/result/' + taskId);
      if (!res.ok) { setStatus('Erro ao consultar resultado.', true); searchBtn.disabled = false; return; }
      var data = await res.json();

      if (data.status === 'error') {
        setProgress(1);
        setStatus(data.message, true);
        searchBtn.disabled = false;
        return;
      }

      if (data.status !== 'done') {
        var m = data.message || '';
        setStatus(m || 'Processando...');
        if (m.includes('Baixando')) setProgress(0.15);
        else if (m.includes('Convertendo')) setProgress(0.4);
        else if (m.includes('Consultando')) setProgress(0.7);
        else if (m.includes('Cache')) setProgress(1);
        setTimeout(function() { pollResult(taskId); }, 1200);
        return;
      }

      setProgress(1);
      searchBtn.disabled = false;

      if (!data.songs || data.songs.length === 0) {
        setStatus('Nenhuma música identificada.');
        resultsEl.classList.add('hidden');
        return;
      }

      setStatus(data.message);
      renderResults(data.songs);
    }

    function renderResults(songs) {
      var top = songs[0];
      var rest = songs.slice(1, 4);

      var plat1 = ['youtube', 'spotify', 'applemusic', 'deezer'];
      heroArea.innerHTML =
        '<div class="hero">' +
        '<img class="hero-artwork" src="' + (top.artwork_url || 'https://via.placeholder.com/140?text=%E2%99%AA') + '" alt="" />' +
        '<h2 class="hero-title">' + escapeHtml(top.title) + '</h2>' +
        '<p class="hero-artist">' + escapeHtml(top.artist) + '</p>' +
        '<span class="hero-meta">' + escapeHtml(top.provider) + ' &middot; ' + Math.round((top.confidence || 0) * 100) + '%</span>' +
        '<div class="hero-links">' +
        plat1.map(function(p) {
          return '<a href="' + searchUrl(p, top.title, top.artist) + '" target="_blank" rel="noopener" title="' + p + '">' + icons[p] + '</a>';
        }).join('') +
        '</div></div>';

      if (rest.length > 0) {
        lowerArea.classList.remove('hidden');
        lowerList.innerHTML = '';
        for (var i = 0; i < rest.length; i++) {
          var s = rest[i];
          var el = document.createElement('div');
          el.className = 'lower-item';
          var plat2 = ['youtube', 'spotify', 'applemusic', 'deezer'];
          el.innerHTML =
            '<img src="' + (s.artwork_url || 'https://via.placeholder.com/40?text=%E2%99%AA') + '" alt="" />' +
            '<div class="lower-info">' +
            '<div class="t">' + escapeHtml(s.title) + '</div>' +
            '<div class="a">' + escapeHtml(s.artist) + '</div></div>' +
            '<div class="side">' +
            '<span class="pct">' + Math.round((s.confidence || 0) * 100) + '%</span>' +
            '<div style="display:flex;gap:2px">' +
            plat2.map(function(p) {
              return '<a href="' + searchUrl(p, s.title, s.artist) + '" target="_blank" rel="noopener" title="' + p + '" class="stream-icon">' + icons[p] + '</a>';
            }).join('') +
            '</div></div>';
          lowerList.appendChild(el);
        }
      } else {
        lowerArea.classList.add('hidden');
      }

      resultsEl.classList.remove('hidden');
    }

    searchBtn.addEventListener('click', async function() {
      var url = urlInput.value.trim();
      if (!url) { setStatus('Cole um link primeiro.', true); return; }

      searchBtn.disabled = true;
      resultsEl.classList.add('hidden');
      progressWrap.classList.remove('active');
      setProgress(0);
      setStatus('Enviando link...');

      try {
        var res = await fetch('/api/identify', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url: url })
        });
        if (!res.ok) throw new Error('');
        var data = await res.json();
        setProgress(0.1);
        pollResult(data.task_id);
      } catch (e) {
        setStatus('Erro de rede. Tente novamente.', true);
        searchBtn.disabled = false;
      }
    });

    urlInput.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') searchBtn.click();
    });

    (async function loadAds() {
      try {
        var res = await fetch('/api/ads');
        if (!res.ok) return;
        var data = await res.json();
        for (var i = 0; i < data.slots.length; i++) {
          var s = data.slots[i];
          var el = document.querySelector('[data-ad="' + s.slot + '"]');
          if (el) { el.innerHTML = s.html; el.classList.add('loaded'); }
        }
      } catch (e) { /* silêncio */ }
    })();
  </script>
</body>
</html>
